version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '04:00'
      timezone: Europe/Madrid
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencias
    groups:
      todas:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '04:00'
      timezone: Europe/Madrid
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencias
      - github-actions
    groups:
      todas:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(actions)'
